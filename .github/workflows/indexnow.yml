name: Notify IndexNow on content updates
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "es/**/*.html"
      - "guides/**/*.html"
      - "tools/**/*.html"
      - "newsletter-resources.html"
      - "sitemap.xml"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check key file and notify IndexNow once
        shell: bash
        run: |
          set -euo pipefail
          KEY="c50ed6e272f44a9686a7bd1e735b910d"
          HOST="https://toolpilot-guide.onrender.com"
          python3 - <<'PYTHON'
          import json, os, time, urllib.request, xml.etree.ElementTree as ET
          host = "toolpilot-guide.onrender.com"
          base = "https://" + host
          key = "c50ed6e272f44a9686a7bd1e735b910d"
          def read(url):
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              return urllib.request.urlopen(req, timeout=25).read()
          def urls(data):
              return sorted(n.text for n in ET.fromstring(data).findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc'))
          source = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['GITHUB_SHA'] + '/sitemap.xml'
          expected = urls(read(source))
          assert expected and all(u.startswith(base + '/') for u in expected)
          for attempt in range(18):
              try:
                  live = urls(read(base + '/sitemap.xml'))
                  if live == expected and read(base + '/' + key + '.txt').decode().strip() == key:
                      break
              except Exception as error:
                  print('Live sitemap check:', type(error).__name__)
              if attempt == 17:
                  raise SystemExit('Current sitemap is not live yet; do not notify stale URLs. Deploy and rerun.')
              time.sleep(10)
          with open('/tmp/toolpilot-indexnow.json', 'w') as f:
              json.dump({'host': host, 'key': key, 'urlList': expected}, f)
          print('Submitting', len(expected), 'canonical URLs after confirming the current sitemap is live')
          PYTHON
          RESPONSE=$(curl --silent --show-error --max-time 30 -w '%{http_code}' -o /tmp/indexnow.response \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/toolpilot-indexnow.json)
          echo "IndexNow HTTP status: $RESPONSE"
          case "$RESPONSE" in
            200|202) echo "Submission received for processing; indexing is NOT guaranteed";;
            *) cat /tmp/indexnow.response; exit 1;;
          esac

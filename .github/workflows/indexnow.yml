name: Notify IndexNow on content updates
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "es/**/*.html"
      - "guides/**/*.html"
      - "tools/**/*.html"
      - "newsletter-resources.html"
      - "sitemap.xml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check key file and notify IndexNow once
        shell: bash
        run: |
          set -euo pipefail
          KEY="c50ed6e272f44a9686a7bd1e735b910d"
          HOST="https://toolpilot-guide.onrender.com"
          echo "Waiting briefly for the static-site publish to propagate"
          sleep 60
          KEY_RESPONSE=$(curl --location --silent --show-error --max-time 25 "$HOST/$KEY.txt" || true)
          if [ "$KEY_RESPONSE" != "$KEY" ]; then
            echo "Key verification file unavailable; do not claim indexing" >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --max-time 25 "$HOST/sitemap.xml" -o /tmp/toolpilot-sitemap.xml
          python3 - <<'PYTHON'
          import json, xml.etree.ElementTree as ET
          host = "toolpilot-guide.onrender.com"
          urls = [n.text for n in ET.parse('/tmp/toolpilot-sitemap.xml').findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert urls and all(u.startswith('https://' + host + '/') for u in urls)
          with open('/tmp/toolpilot-indexnow.json', 'w') as f:
              json.dump({'host': host, 'key': 'c50ed6e272f44a9686a7bd1e735b910d', 'urlList': urls}, f)
          print('Submitting', len(urls), 'canonical URLs from the live sitemap')
          PYTHON
          RESPONSE=$(curl --silent --show-error --max-time 30 -w '%{http_code}' -o /tmp/indexnow.response \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/toolpilot-indexnow.json)
          echo "IndexNow HTTP status: $RESPONSE"
          case "$RESPONSE" in
            200|202) echo "Submission received for processing; indexing is NOT guaranteed";;
            *) cat /tmp/indexnow.response; exit 1;;
          esac

name: ToolPilot production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Render static deploy
        if: github.event_name == 'push'
        run: sleep 75

      - name: Verify public revenue funnel
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://toolpilot-guide.onrender.com"
          CAMPAIGN="$BASE/go/black-friday-saas-deal-checker-2026.html"

          fetch() {
            local url="$1" out="$2"
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 30 "$url" -o "$out"
          }

          fetch "$CAMPAIGN" /tmp/campaign.html
          fetch "$BASE/black-friday/saas-cost-calculator.html" /tmp/bf.html
          fetch "$BASE/guides/best-free-newsletter-platforms-2026.html" /tmp/free.html
          fetch "$BASE/sitemap.xml" /tmp/sitemap.xml
          fetch "https://rjgpwcmfgdkmlplifwck.supabase.co/functions/v1/toolpilot-event" /tmp/event.json
          fetch "https://rjgpwcmfgdkmlplifwck.supabase.co/functions/v1/toolpilot-lead-capture" /tmp/lead.json

          grep -q 'Should you actually buy that SaaS Black Friday deal?' /tmp/campaign.html
          grep -q 'bf-deal-checker-watchlist' /tmp/campaign.html
          grep -q 'toolpilot-lead-capture' /tmp/campaign.html
          grep -q 'affiliate_click' /tmp/campaign.html
          grep -q 'page_view' /tmp/campaign.html
          grep -q 'via=mario-belmonte' /tmp/campaign.html
          grep -q 'Get the verified deal watchlist' /tmp/bf.html
          grep -q 'beehiiv vs Sender vs Substack' /tmp/free.html
          grep -q '/black-friday/saas-cost-calculator.html' /tmp/sitemap.xml
          grep -q '"version":"2"' /tmp/event.json
          grep -q '"service":"toolpilot-lead-capture"' /tmp/lead.json

          echo "PASS: ToolPilot campaign, lead capture and affiliate tracking are publicly reachable."

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaS Stack Cost Audit</title><style>body{font:14px system-ui;background:#101114;color:#f5f1e9;margin:0;padding:18px}*{box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{border:1px solid #48443e;padding:7px}input{width:100%;padding:7px;background:#1d1e22;color:#fff;border:1px solid #5a554d}.r{margin-top:14px;padding:12px;border-left:3px solid #daba81;background:#201d18}.brand{font-size:12px}.brand a{color:#daba81}</style></head><body><h2>SaaS Stack Cost Audit</h2><table><thead><tr><th>Tool</th><th>Category</th><th>$/mo</th><th>Use %</th></tr></thead><tbody id="r"></tbody></table><button id="a">+ Tool</button> <button id="go">Audit</button><div class="r" id="out">Add your tools and run the audit.</div><p class="brand">Free audit by <a target="_blank" rel="noopener" href="https://toolpilot-guide.onrender.com/tools/saas-stack-cost-audit.html">ToolPilot Guide</a></p><script>const r=document.getElementById('r');function add(){const t=document.createElement('tr');t.innerHTML='<td><input></td><td><input></td><td><input type="number" min="0"></td><td><input type="number" min="0" max="100" value="100"></td>';r.appendChild(t)}for(let i=0;i<5;i++)add();document.getElementById('a').onclick=add;document.getElementById('go').onclick=()=>{let m=0,w=0,c={};[...r.querySelectorAll('tr')].forEach(t=>{const x=t.querySelectorAll('input'),cat=x[1].value.toLowerCase()||'uncategorized',cost=+x[2].value||0,use=Math.min(100,Math.max(0,+x[3].value||0));m+=cost;w+=cost*(1-use/100);c[cat]=(c[cat]||0)+1});const d=Object.entries(c).filter(([k,v])=>k!=='uncategorized'&&v>1).map(([k,v])=>k+' ('+v+')');document.getElementById('out').innerHTML='Annual spend: <strong>$'+(m*12).toFixed(2)+'</strong><br>Low-use estimate: <strong>$'+(w*12).toFixed(2)+'/yr</strong><br>Duplicate categories: <strong>'+(d.join(', ')||'None flagged')+'</strong>'};</script></body></html>

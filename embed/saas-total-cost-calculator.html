<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaS Total Cost Calculator</title><style>body{font-family:system-ui,sans-serif;background:#101114;color:#f5f1e9;margin:0;padding:20px}*{box-sizing:border-box}.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:12px;color:#cfc7ba}input{width:100%;margin-top:5px;padding:10px;border:1px solid #4b463e;background:#191a1e;color:#fff}.r{margin-top:16px;padding:16px;border:1px solid #705a3c;background:#191814}.r strong{color:#f0c987}.brand{font-size:12px;margin-top:12px}.brand a{color:#daba81}@media(max-width:560px){.g{grid-template-columns:1fr}}</style></head><body><h2>SaaS total cost calculator</h2><div class="g"><label>Base monthly price ($)<input id="m" type="number" min="0" value="49"></label><label>Seats<input id="s" type="number" min="1" value="1"></label><label>Add-ons / month ($)<input id="a" type="number" min="0" value="0"></label><label>Usage / month ($)<input id="u" type="number" min="0" value="0"></label><label>Setup ($)<input id="o" type="number" min="0" value="0"></label><label>Migration hours<input id="h" type="number" min="0" value="0"></label><label>Admin hours / month<input id="q" type="number" min="0" value="1"></label><label>Staff $/hour<input id="v" type="number" min="0" value="40"></label></div><div class="r"><div>First-year total: <strong id="y">—</strong></div><div>Annual renewal operating cost: <strong id="r">—</strong></div><div>3-year total: <strong id="t">—</strong></div></div><p class="brand">Free calculator by <a target="_blank" rel="noopener" href="https://toolpilot-guide.onrender.com/tools/saas-total-cost-calculator.html">ToolPilot Guide</a></p><script>const f=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'}),v=i=>Math.max(0,Number(document.getElementById(i).value)||0);function c(){const rec=v('m')*Math.max(1,Math.round(v('s')))+v('a')+v('u')+v('q')*v('v'),y=rec*12+v('o')+v('h')*v('v'),r=rec*12;document.getElementById('y').textContent=f(y);document.getElementById('r').textContent=f(r);document.getElementById('t').textContent=f(y+r*2)}['m','s','a','u','o','h','q','v'].forEach(i=>document.getElementById(i).addEventListener('input',c));c();</script></body></html>
